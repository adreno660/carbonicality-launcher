name: Sync linux.yml to all branches

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/linux.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync to all branches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILE=".github/workflows/linux.yml"

          for branch in $(git branch -r | grep -v '\->' | grep -v 'develop' | sed 's/origin\///'); do
            echo "Syncing to $branch..."
            git checkout "$branch"
            git checkout develop -- "$FILE"
            git add "$FILE"
            git diff --cached --quiet && continue
            git commit -m "ci: sync linux.yml from develop"
            git push origin "$branch"
          done
